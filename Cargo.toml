[workspace]
members = ["crates/kernel", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The wasm build optimises for download size on a phone connection.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
