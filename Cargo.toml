[workspace]
members = ["crates/kernel", "crates/sketch", "crates/document", "crates/render", "crates/mcp", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Free-form surfaces and fuzz-like tests do a lot of arithmetic, so a little optimisation takes minutes off a
# test run. It keeps debug assertions and overflow checks.
[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The wasm build favours speed: a slider rebuild on a phone matters more than the
# difference in download size, which is a few hundred KB either way.
[profile.wasm]
inherits = "release"
opt-level = 3
panic = "abort"
strip = true
